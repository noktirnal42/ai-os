# On-screen session config for the VM's virtual display (VM_DISPLAY=cocoa).
# The virtual output is large on a Retina Mac, so keep the scale at 1 (crisp) and use a moderate font.
output * scale 1
default_border pixel 2
set $mod Mod1

# Launcher and apps. Mod is Alt (Option in the QEMU window).
bindsym $mod+Return exec foot
bindsym $mod+d exec fuzzel
bindsym $mod+e exec foot -e ranger
bindsym $mod+t exec foot -e micro
bindsym $mod+w exec foot -e /ai/bin/welcome
bindsym $mod+m exec env GSK_RENDERER=cairo /ai/bin/mailwindow
bindsym $mod+c exec foot -e /ai/bin/calcview
bindsym $mod+s exec foot -e /ai/bin/settings
bindsym $mod+a exec /ai/bin/chatwindow
bindsym $mod+Shift+a exec foot -e /ai/bin/aios tui
bindsym $mod+q kill
bindsym $mod+Shift+e exec swaymsg exit
bindsym $mod+space exec /ai/bin/appmenu
bindsym $mod+g exec /ai/bin/activity

# Windows: move focus with h/j/k/l, move windows with Shift, toggle fullscreen and floating.
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+b splith
bindsym $mod+v splitv

# Workspaces 1-4: Alt+number switches, Alt+Shift+number moves the focused window.
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4

# Top bar: model, free memory, and time.
bar {
    position top
    status_command /ai/bin/statusline
    colors {
        background #1c1c1c
        statusline #d8d8d8
    }
}

exec foot -e /ai/bin/welcome
