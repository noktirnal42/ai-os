# On-screen session config for the VM's virtual display (VM_DISPLAY=cocoa).
# The virtual output is large on a Retina Mac, so keep the scale at 1 (crisp) and use a moderate font.
output * scale 1
default_border pixel 2
set $mod Mod1

# Launcher and apps. Mod is Alt (Option in the QEMU window).
bindsym $mod+Return exec foot --font=monospace:size=12
bindsym $mod+d exec fuzzel
bindsym $mod+e exec foot --font=monospace:size=12 -e ranger
bindsym $mod+t exec foot --font=monospace:size=12 -e micro
bindsym $mod+w exec foot --font=monospace:size=12 -e /ai/bin/welcome
bindsym $mod+q kill
bindsym $mod+Shift+e exec swaymsg exit

exec foot --font=monospace:size=12 -e /ai/bin/welcome
