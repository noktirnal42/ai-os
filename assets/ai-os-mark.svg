<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">AI OS mark</title><desc id="desc">A cyan and violet orbital mark beside the AI OS wordmark.</desc>
