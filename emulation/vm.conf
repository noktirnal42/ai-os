# emulation/vm.conf — AI OS emulator tunables
# Source-of-truth defaults; override any value by exporting the same name.

# VM sizing (18 GB M3 budget: host model ~6GB + VM 4GB + macOS/agents ~7GB)
VM_MEM_MB="${VM_MEM_MB:-4096}"
VM_CPUS="${VM_CPUS:-4}"
VM_DISK_GB="${VM_DISK_GB:-20}"
VM_ACCEL="${VM_ACCEL:-hvf}"          # hvf (Apple Hypervisor) | tcg fallback

# Networking
SSH_PORT="${SSH_PORT:-2222}"          # host -> guest ssh (guest :22)
MODEL_PORT="${MODEL_PORT:-8080}"      # host llama-server; guest reaches 10.0.2.2:8080

# Guest image: Alpine aarch64 cloud image (UEFI, cloud-init).
# If IMAGE_URL empty, download-image.sh resolves the latest matching release.
ALPINE_MIRROR="${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}"
ALPINE_BRANCH="${ALPINE_BRANCH:-v3.22}"
IMAGE_URL="${IMAGE_URL:-}"            # explicit override wins
IMAGE_VARIANT="${IMAGE_VARIANT:-uefi}" # uefi | bios  (aarch64 needs uefi)

# Guest identity
GUEST_USER="${GUEST_USER:-ai}"
GUEST_HOSTNAME="${GUEST_HOSTNAME:-ai-os-emu}"

# Paths (relative to emulation/)
ARTIFACTS_DIR="${ARTIFACTS_DIR:-emulation/artifacts}"
DISK_FILE="${DISK_FILE:-emulation/artifacts/aios-dev.qcow2}"
SEED_ISO="${SEED_ISO:-emulation/artifacts/seed-dev.iso}"
CONSOLE_LOG="${CONSOLE_LOG:-emulation/artifacts/console.log}"
QEMU_PIDFILE="${QEMU_PIDFILE:-emulation/artifacts/qemu.pid}"

# Model (host-served; EM-1 split-brain)
MODEL_DIR="${MODEL_DIR:-emulation/models}"
MODEL_FILE="${MODEL_FILE:-}"          # explicit gguf path wins
MODEL_REPO="${MODEL_REPO:-Qwen/Qwen2.5-Coder-7B-Instruct-GGUF}"
MODEL_REPO_FILE="${MODEL_REPO_FILE:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}"

# Boot
WAIT_SSH_TIMEOUT="${WAIT_SSH_TIMEOUT:-300}"

# Separate verified development instance; inherited aios.qcow2 is preserved.
BASE_IMAGE_FILE="${BASE_IMAGE_FILE:-artifacts/alpine-verified.qcow2}"
SSH_KEY_FILE="${SSH_KEY_FILE:-artifacts/dev_ed25519}"
